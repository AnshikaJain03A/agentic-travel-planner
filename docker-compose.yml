# ============================================================
#  Agentic AI Travel Planner - local orchestration
#  Spins up the FastAPI backend and the Streamlit frontend,
#  sharing a single persisted data volume.
# ============================================================
services:
  api:
    build: .
    container_name: travel-planner-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: .
    container_name: travel-planner-frontend
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network the API is reachable by service name.
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api
